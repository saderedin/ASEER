<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>مستكشف منطقة عسير</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            background: #eef2f1;
            color: #18312e;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-reference-info {
            position: absolute;
            z-index: 450;
            right: 10px;
            bottom: 54px;
            width: max-content;
            max-width: calc(100% - 20px);
            padding: 5px 8px;
            border: 1px solid rgba(175, 220, 255, 0.8);
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.94);
            color: #18312e;
            box-shadow: 0 2px 10px rgba(24, 49, 46, 0.2);
            pointer-events: none;
        }

        .north-indicator {
            display: grid;
            justify-items: center;
            gap: 0;
            min-width: 38px;
            padding: 5px 4px 4px;
            border: 1px solid rgba(154, 220, 255, 0.9);
            border-radius: 7px;
            background: linear-gradient(145deg, #0758ad, #168cf2);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.1;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0, 78, 160, 0.35);
        }

        .north-indicator-arrow {
            font-size: 19px;
            line-height: 1;
        }

        .leaflet-control-layers-close {
            display: none;
            margin: 0 0 5px auto;
            padding: 3px 8px;
            border: 1px solid #b6c6d4;
            border-radius: 5px;
            background: #fff;
            color: #18312e;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .leaflet-control-layers-expanded .leaflet-control-layers-close {
            display: block;
        }

        .coordinate-reference {
            display: block;
            font-size: clamp(8px, 0.75vw, 11px);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .map-heading {
            position: absolute;
            z-index: 500;
            top: 18px;
            right: 18px;
            width: min(390px, calc(100vw - 36px));
            max-width: min(390px, calc(100% - 36px));
            padding: 16px 20px;
            border: 1px solid rgba(154, 220, 255, 0.8);
            border-radius: 14px;
            background: linear-gradient(145deg, #062b68 0%, #0758ad 52%, #168cf2 100%);
            color: #fff;
            box-shadow:
                0 0 12px rgba(55, 173, 255, 0.75),
                0 0 30px rgba(0, 115, 255, 0.48),
                0 12px 32px rgba(2, 28, 72, 0.35);
            max-height: calc(100vh - 36px);
            max-height: calc(100dvh - 36px);
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .map-heading h1 {
            margin: 0;
            font-size: 19px;
        }

        .map-heading-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .map-heading-actions {
            display: flex;
            flex: 0 0 auto;
            gap: 6px;
        }

        .map-heading-toggle {
            flex: 0 0 auto;
            min-height: 34px;
            padding: 6px 10px;
            border: 1px solid rgba(193, 233, 255, 0.9);
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.94);
            color: #064589;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .map-heading-toggle:hover {
            background: #dff4ff;
        }

        .map-heading-toggle:focus-visible {
            outline: 2px solid #1976d2;
            outline-offset: 2px;
        }

        .map-heading-content {
            margin-top: 10px;
        }

        .map-heading-content[hidden] {
            display: none;
        }

        .map-heading p {
            margin: 0;
            color: #e1f3ff;
            font-size: 13px;
            line-height: 1.6;
        }

        .feature-search {
            display: grid;
            gap: 10px;
            margin-top: 12px;
        }

        .feature-search label {
            display: grid;
            gap: 5px;
            font-size: 13px;
            color: #f2f9ff;
        }

        .feature-search select {
            width: 100%;
            min-height: 36px;
            padding: 6px 9px;
            border: 1px solid #a9d8ff;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.98);
            color: #102e50;
            font: inherit;
        }

        .feature-search select:disabled {
            background: #e7f1f8;
            color: #657c91;
        }

        .project-search {
            display: grid;
            gap: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(195, 231, 255, 0.48);
        }

        .project-search-title {
            margin: 0;
            font-size: 14px;
            color: #fff;
        }

        .layer-opacity-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }

        .opacity-control {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 7px 8px;
            font-size: 13px;
            color: #f2f9ff;
        }

        .opacity-control input {
            grid-column: 1 / -1;
            width: 100%;
            margin: 0;
            accent-color: #1976d2;
            cursor: pointer;
        }

        .opacity-value {
            color: #c9eaff;
            font-variant-numeric: tabular-nums;
        }

        .map-message {
            position: absolute;
            z-index: 1000;
            right: 50%;
            bottom: 24px;
            width: max-content;
            max-width: calc(100% - 32px);
            padding: 12px 16px;
            transform: translateX(50%);
            border-radius: 10px;
            background: #18312e;
            color: #fff;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
            box-shadow: 0 6px 20px rgba(24, 49, 46, 0.2);
        }

        .map-message.error {
            background: #8c3028;
        }

        html[dir="rtl"] .leaflet-control-layers,
        html[dir="rtl"] .leaflet-control-attribution {
            direction: rtl;
        }

        html[dir="ltr"] .leaflet-control-layers,
        html[dir="ltr"] .leaflet-control-attribution {
            direction: ltr;
        }

        @media (max-width: 600px) {
            .map-reference-info {
                right: 10px;
                bottom: max(79px, calc(env(safe-area-inset-bottom) + 75px));
                max-width: calc(100vw - 20px);
                padding: 5px 7px;
            }

            .coordinate-reference {
                font-size: clamp(8px, 2.5vw, 10px);
            }

            .north-indicator-arrow {
                font-size: 19px;
            }

            .map-heading {
                top: max(8px, env(safe-area-inset-top));
                right: 8px;
                width: calc(100vw - 72px);
                max-width: none;
                max-height: min(62vh, calc(100vh - 16px));
                max-height: min(62dvh, calc(100dvh - 16px));
                padding: 12px;
                border-radius: 12px;
            }

            .map-heading-header {
                gap: 8px;
                flex-wrap: wrap;
            }

            .map-heading-actions {
                gap: 5px;
                margin-inline-start: auto;
            }

            .map-heading-toggle {
                min-height: 40px;
                padding: 7px 9px;
                font-size: 12px;
            }

            .map-heading h1 {
                font-size: clamp(15px, 4vw, 18px);
            }

            .map-heading p {
                font-size: 12px;
            }

            .feature-search {
                gap: 8px;
                margin-top: 8px;
            }

            .feature-search select {
                min-height: 40px;
                font-size: 16px;
            }

            .project-search {
                gap: 8px;
                padding-top: 8px;
            }

            .layer-opacity-controls {
                gap: 8px;
                margin-top: 10px;
            }

            .opacity-control input {
                min-height: 24px;
            }

            .leaflet-control-layers {
                max-width: calc(100vw - 84px);
            }

            .leaflet-control-layers-expanded {
                max-height: 40vh;
                overflow-y: auto;
            }

            .leaflet-bottom .leaflet-control-attribution {
                position: fixed;
                right: auto;
                bottom: 0;
                left: 50vw;
                width: max-content;
                max-width: calc(100vw - 128px);
                transform: translateX(-50%);
                text-align: center;
                white-space: normal;
            }

            .leaflet-bottom .leaflet-control-scale {
                position: fixed;
                right: max(10px, env(safe-area-inset-right));
                bottom: max(56px, calc(env(safe-area-inset-bottom) + 52px));
                left: auto;
                margin: 0;
            }

            .map-message {
                bottom: max(12px, env(safe-area-inset-bottom));
                max-width: calc(100vw - 24px);
                padding: 10px 12px;
                font-size: 13px;
            }
        }

        @media (max-width: 600px) and (max-height: 520px) {
            .map-heading {
                max-height: calc(100vh - 16px);
                max-height: calc(100dvh - 16px);
                width: min(390px, calc(100vw - 16px));
            }

            .map-heading-content {
                margin-top: 6px;
            }

            .feature-search {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                align-items: start;
            }

            .project-search {
                grid-column: 1 / -1;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .project-search-title {
                grid-column: 1 / -1;
            }
        }
    </style>
</head>
<body>
    <main id="map" aria-label="خريطة تفاعلية لمنطقة عسير" data-i18n-aria="mapLabel"></main>
    <header class="map-heading">
        <div class="map-heading-header">
            <h1 data-i18n="title">مستكشف منطقة عسير</h1>
            <div class="map-heading-actions">
                <button class="map-heading-toggle" id="language-toggle" type="button"
                    aria-label="Switch to English" data-i18n-aria="languageToggleLabel">English</button>
                <button class="map-heading-toggle" id="map-heading-toggle" type="button"
                    aria-expanded="true" aria-controls="map-heading-content" data-i18n="hidePanel">إخفاء القائمة</button>
            </div>
        </div>
        <div class="map-heading-content" id="map-heading-content">
            <div class="feature-search">
                <label for="governorate-search">
                    <span data-i18n="governorate">المحافظة</span>
                    <select id="governorate-search">
                        <option value="" data-i18n="chooseGovernorate">اختر المحافظة</option>
                    </select>
                </label>
                <label for="center-search">
                    <span data-i18n="center">المركز</span>
                    <select id="center-search" disabled>
                        <option value="" data-i18n="chooseGovernorateFirst">اختر المحافظة أولًا</option>
                    </select>
                </label>
                <label for="district-search">
                    <span data-i18n="district">الحي</span>
                    <select id="district-search" disabled>
                        <option value="" data-i18n="chooseGovernorateFirst">اختر المحافظة أولًا</option>
                    </select>
                </label>
                <section class="project-search" aria-labelledby="project-search-title">
                    <h2 class="project-search-title" id="project-search-title" data-i18n="projects">المشاريع</h2>
                    <label for="project-type-search">
                        <span data-i18n="projectType">نوع المشروع</span>
                        <select id="project-type-search">
                            <option value="" data-i18n="chooseProjectType">اختر نوع المشروع</option>
                            <option value="wastewater" data-i18n="wastewaterProjects">مشاريع الصرف الصحي</option>
                            <option value="water" data-i18n="waterProjects">مشاريع المياه</option>
                        </select>
                    </label>
                    <label for="project-status-search">
                        <span data-i18n="projectStatus">حالة المشاريع</span>
                        <select id="project-status-search" disabled>
                            <option value="" data-i18n="chooseProjectTypeFirst">اختر نوع المشروع أولًا</option>
                        </select>
                    </label>
                    <label for="project-search">
                        <span data-i18n="project">المشروع</span>
                        <select id="project-search" disabled>
                            <option value="" data-i18n="projectsAddedLater">تُضاف المشاريع عبر ملفات JSON لاحقًا</option>
                        </select>
                    </label>
                </section>
            </div>
            <div class="layer-opacity-controls">
                <label class="opacity-control" for="governorate-opacity">
                    <span data-i18n="governorates">المحافظات</span>
                    <output class="opacity-value" id="governorate-opacity-value" for="governorate-opacity">20٪</output>
                    <input id="governorate-opacity" type="range" min="0" max="100" value="20"
                        aria-label="المحافظات" data-i18n-aria="governorates">
                </label>
                <label class="opacity-control" for="district-opacity">
                    <span data-i18n="districts">الأحياء</span>
                    <output class="opacity-value" id="district-opacity-value" for="district-opacity">20٪</output>
                    <input id="district-opacity" type="range" min="0" max="100" value="20"
                        aria-label="الأحياء" data-i18n-aria="districts">
                </label>
            </div>
        </div>
    </header>
    <div id="map-message" class="map-message" role="status" data-i18n="loading">جارٍ تحميل بيانات الخريطة...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.12.1/proj4.js"></script>
    <script>
        const message = document.getElementById("map-message");
        const languageToggle = document.getElementById("language-toggle");
        const mapHeadingToggle = document.getElementById("map-heading-toggle");
        const mapHeadingContent = document.getElementById("map-heading-content");
        const translations = {
            ar: {
                title: "مستكشف منطقة عسير",
                mapLabel: "خريطة تفاعلية لمنطقة عسير",
                languageToggle: "English",
                languageToggleLabel: "Switch to English",
                hidePanel: "إخفاء القائمة",
                showPanel: "إظهار القائمة",
                governorate: "المحافظة",
                chooseGovernorate: "اختر المحافظة",
                chooseGovernorateFirst: "اختر المحافظة أولًا",
                center: "المركز",
                district: "الحي",
                projects: "المشاريع",
                projectType: "نوع المشروع",
                chooseProjectType: "اختر نوع المشروع",
                wastewaterProjects: "مشاريع الصرف الصحي",
                waterProjects: "مشاريع المياه",
                projectStatus: "حالة المشاريع",
                chooseProjectTypeFirst: "اختر نوع المشروع أولًا",
                chooseProjectStatus: "اختر حالة المشاريع",
                existingProjects: "المشاريع القائمة",
                projectsUnderConstruction: "المشاريع تحت التنفيذ",
                futureProjects: "المشاريع المستقبلية",
                project: "المشروع",
                projectsAddedLater: "تُضاف المشاريع عبر ملفات JSON لاحقًا",
                noProjects: "لا توجد بيانات مشاريع مضافة لهذه الفئة حاليًا",
                governorates: "المحافظات",
                districts: "الأحياء",
                loading: "جارٍ تحميل بيانات الخريطة...",
                libraryError: "تعذر تحميل مكتبات الخريطة. تحقق من اتصال الإنترنت ثم أعد فتح الصفحة.",
                fileLoadError: "تعذر تحميل الملف {file}.",
                invalidGeoJson: "محتوى أحد ملفات GeoJSON غير صالح.",
                mapDataError: "تعذر تحميل بيانات الخريطة.",
                loadFailure: "{details}",
                localFileHint: " شغّل الصفحة عبر خادم محلي (مثل Live Server) بدل فتح ملف HTML مباشرة.",
                networkFileHint: " تحقق من رفع ملفات GeoJSON الثلاثة بجانب index.html ومن اتصال الإنترنت.",
                chooseCenter: "اختر المركز",
                chooseDistrict: "اختر الحي",
                noCenters: "لا توجد مراكز مسجلة لهذه المحافظة",
                noDistricts: "لا توجد أحياء مسجلة لهذه المحافظة",
                unknownGovernorate: "محافظة غير معروفة",
                unknownCenter: "مركز غير معروف",
                unknownDistrict: "حي غير معروف",
                satellite: "صور الأقمار الصناعية",
                streets: "خريطة الشوارع",
                mapLayers: "الطبقات",
                hideMapLayers: "إخفاء الطبقات",
                governorateLayer: "المحافظات",
                centerLayer: "المراكز",
                districtLayer: "الأحياء",
                zoomIn: "تكبير",
                zoomOut: "تصغير",
                scale: "مقياس الرسم",
                north: "شمال",
                northDirection: "اتجاه الشمال",
                mapCrs: "نظام عرض الخريطة",
                dataCrs: "نظام إحداثيات البيانات",
                webMercator: "WGS 84 / Web Mercator",
                utm38n: "WGS 84 / UTM المنطقة 38 شمال",
                crsSummary: "نظام العرض: EPSG:3857 | البيانات: EPSG:32638",
                opacityUnit: "٪"
            },
            en: {
                title: "Aseer Region Explorer",
                mapLabel: "Interactive map of Aseer Region",
                languageToggle: "العربية",
                languageToggleLabel: "التبديل إلى العربية",
                hidePanel: "Hide panel",
                showPanel: "Show panel",
                governorate: "Governorate",
                chooseGovernorate: "Choose a governorate",
                chooseGovernorateFirst: "Choose a governorate first",
                center: "Center",
                district: "District",
                projects: "Projects",
                projectType: "Project type",
                chooseProjectType: "Choose a project type",
                wastewaterProjects: "Wastewater projects",
                waterProjects: "Water projects",
                projectStatus: "Project status",
                chooseProjectTypeFirst: "Choose a project type first",
                chooseProjectStatus: "Choose a project status",
                existingProjects: "Existing projects",
                projectsUnderConstruction: "Projects under construction",
                futureProjects: "Future projects",
                project: "Project",
                projectsAddedLater: "Projects will be added through JSON files later",
                noProjects: "No project data has been added for this category yet",
                governorates: "Governorates",
                districts: "Districts",
                loading: "Loading map data...",
                libraryError: "Could not load the map libraries. Check your internet connection and reload the page.",
                fileLoadError: "Could not load file {file}.",
                invalidGeoJson: "One of the GeoJSON files contains invalid data.",
                mapDataError: "Could not load the map data.",
                loadFailure: "{details}",
                localFileHint: " Run the page through a local web server (such as Live Server) instead of opening the HTML file directly.",
                networkFileHint: " Make sure all three GeoJSON files are next to index.html and check your internet connection.",
                chooseCenter: "Choose a center",
                chooseDistrict: "Choose a district",
                noCenters: "No centers are registered for this governorate",
                noDistricts: "No districts are registered for this governorate",
                unknownGovernorate: "Unknown governorate",
                unknownCenter: "Unknown center",
                unknownDistrict: "Unknown district",
                satellite: "Satellite imagery",
                streets: "Street map",
                mapLayers: "Map layers",
                hideMapLayers: "Hide layers",
                governorateLayer: "Governorates",
                centerLayer: "Centers",
                districtLayer: "Districts",
                zoomIn: "Zoom in",
                zoomOut: "Zoom out",
                scale: "Scale bar",
                north: "N",
                northDirection: "North direction",
                mapCrs: "Map projection",
                dataCrs: "Data coordinate system",
                webMercator: "WGS 84 / Web Mercator",
                utm38n: "WGS 84 / UTM zone 38N",
                crsSummary: "Map: EPSG:3857 | Data: EPSG:32638",
                opacityUnit: "%"
            }
        };
        let currentLanguage = "ar";
        let mapMessageKey = "loading";
        let mapMessageValues = {};
        let mapMessageDetailKey = "";
        let mapMessageDetailValues = {};
        let mapMessageSuffix = "";
        let refreshDynamicLanguage = function () {};
        let refreshMapReferenceLanguage = function () {};

        function translate(key, values) {
            return translations[currentLanguage][key].replace(/\{(\w+)\}/g, function (match, name) {
                return values && values[name] !== undefined ? values[name] : match;
            });
        }

        function formatOpacity(percentage) {
            return percentage + translate("opacityUnit");
        }

        function applyLanguage() {
            document.documentElement.lang = currentLanguage;
            document.documentElement.dir = currentLanguage === "ar" ? "rtl" : "ltr";
            document.title = translate("title");
            refreshMapReferenceLanguage();

            document.querySelectorAll("[data-i18n]").forEach(function (element) {
                element.textContent = translate(element.getAttribute("data-i18n"));
            });
            document.querySelectorAll("[data-i18n-aria]").forEach(function (element) {
                element.setAttribute("aria-label", translate(element.getAttribute("data-i18n-aria")));
            });
            languageToggle.textContent = translate("languageToggle");
            languageToggle.setAttribute("aria-label", translate("languageToggleLabel"));
            const panelExpanded = mapHeadingToggle.getAttribute("aria-expanded") === "true";
            mapHeadingToggle.textContent = translate(panelExpanded ? "hidePanel" : "showPanel");
            const messageDetail = mapMessageDetailKey
                ? translate(mapMessageDetailKey, mapMessageDetailValues) +
                    (mapMessageSuffix ? translate(mapMessageSuffix) : "")
                : "";
            message.textContent = mapMessageKey === "loadFailure"
                ? translate(mapMessageKey, { details: messageDetail })
                : translate(mapMessageKey, mapMessageValues);

            ["governorate-opacity-value", "district-opacity-value"].forEach(function (id) {
                const output = document.getElementById(id);
                const sliderId = output.getAttribute("for");
                const percentage = document.getElementById(sliderId).value;
                output.value = formatOpacity(percentage);
                output.textContent = formatOpacity(percentage);
            });
            refreshDynamicLanguage();
        }

        languageToggle.addEventListener("click", function () {
            currentLanguage = currentLanguage === "ar" ? "en" : "ar";
            applyLanguage();
        });

        const projectStatuses = [
            { value: "existing", key: "existingProjects" },
            { value: "under-construction", key: "projectsUnderConstruction" },
            { value: "future", key: "futureProjects" }
        ];

        mapHeadingToggle.addEventListener("click", function () {
            const isExpanded = mapHeadingToggle.getAttribute("aria-expanded") === "true";
            mapHeadingToggle.setAttribute("aria-expanded", String(!isExpanded));
            mapHeadingToggle.textContent = translate(isExpanded ? "showPanel" : "hidePanel");
            mapHeadingContent.hidden = isExpanded;
        });

        applyLanguage();

        if (!window.L || !window.proj4) {
            mapMessageKey = "libraryError";
            message.textContent = translate(mapMessageKey);
            message.classList.add("error");
            throw new Error("Leaflet or Proj4 could not be loaded.");
        }

        const map = L.map("map", { zoomControl: false }).setView([18.2, 42.5], 8);

        const zoomControl = L.control.zoom({ position: "bottomleft" }).addTo(map);
        const scaleControl = L.control.scale({
            position: "bottomright",
            metric: true,
            imperial: false,
            maxWidth: 120,
            updateWhenIdle: true
        }).addTo(map);
        scaleControl.getContainer().setAttribute("aria-label", translate("scale"));
        scaleControl.getContainer().setAttribute("role", "img");

        const northControl = L.control({ position: "topleft" });
        northControl.onAdd = function () {
            const indicator = L.DomUtil.create("div", "north-indicator");
            indicator.setAttribute("role", "img");
            indicator.setAttribute("aria-label", translate("northDirection"));
            indicator.innerHTML =
                '<span class="north-indicator-arrow" aria-hidden="true">▲</span>' +
                '<span>N</span>';
            return indicator;
        };
        northControl.addTo(map);

        const mapReferenceInfo = document.createElement("aside");
        mapReferenceInfo.className = "map-reference-info";
        mapReferenceInfo.setAttribute("aria-label", "معلومات نظام إحداثيات الخريطة");
        mapReferenceInfo.innerHTML =
            '<div class="coordinate-reference" data-map-reference="crsSummary"></div>';
        document.getElementById("map").appendChild(mapReferenceInfo);

        refreshMapReferenceLanguage = function () {
            mapReferenceInfo.setAttribute("aria-label", currentLanguage === "ar"
                ? "معلومات نظام إحداثيات الخريطة"
                : "Map coordinate reference information");
            mapReferenceInfo.querySelectorAll("[data-map-reference]").forEach(function (element) {
                element.textContent = translate(element.getAttribute("data-map-reference"));
            });
            northControl.getContainer().setAttribute("aria-label", translate("northDirection"));
            scaleControl.getContainer().setAttribute("aria-label", translate("scale"));
        };
        refreshMapReferenceLanguage();

        const satelliteLayer = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                maxZoom: 19,
                attribution: "Tiles &copy; Esri — Sources: Esri, Maxar, Earthstar Geographics, and the GIS User Community"
            }
        ).addTo(map);
        const streetLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        });

        proj4.defs("EPSG:32638", "+proj=utm +zone=38 +datum=WGS84 +units=m +no_defs +type=crs");

        function localizedFeatureName(properties, arabicField, englishField, fallbackKey) {
            const name = currentLanguage === "ar"
                ? properties[arabicField] || properties[englishField]
                : properties[englishField] || properties[arabicField];
            return name || translate(fallbackKey);
        }

        function makeLayer(data, color, nameField, fallbackField, styleOverrides) {
            return L.geoJSON(data, {
                coordsToLatLng: function (coordinates) {
                    const projected = proj4("EPSG:32638", "EPSG:4326", [coordinates[0], coordinates[1]]);
                    return L.latLng(projected[1], projected[0]);
                },
                onEachFeature: function (feature, layer) {
                    const properties = feature.properties || {};
                    const name = currentLanguage === "ar"
                        ? properties[nameField] || properties[fallbackField]
                        : properties[fallbackField] || properties[nameField];
                    if (name) {
                        const popup = document.createElement("strong");
                        popup.textContent = String(name);
                        layer.bindPopup(popup);
                    }
                },
                style: Object.assign({
                    color: color,
                    weight: 1.5,
                    opacity: 0.9,
                    fillColor: color,
                    fillOpacity: 0.12
                }, styleOverrides || {}),
            });
        }

        async function loadMapData() {
            const files = ["AS_BM_AD_GOV.geojson", "AS_BM_AD_MKZ.geojson", "AS_BM_AD_DIS.geojson"];
            const responses = await Promise.all(files.map(function (file) {
                return fetch(file).then(function (response) {
                    if (!response.ok) {
                        throw new Error("file:" + file);
                    }
                    return response.json();
                });
            }));
            const governorates = responses[0];
            const centers = responses[1];
            const districts = responses[2];

            if (!Array.isArray(governorates.features) || !Array.isArray(centers.features) || !Array.isArray(districts.features)) {
                throw new Error("invalidGeoJson");
            }

            const governorateColor = "#1976d2";
            const districtColor = "#e53935";
            const governorateLayer = makeLayer(governorates, governorateColor, "GovernorateNameA", "GovernorateNameE");
            const centerLayer = makeLayer(centers, "#171717", "MarkazNameA", "MarkazNameE", {
                weight: 1.5,
                fillOpacity: 0,
                dashArray: "6 5"
            });
            const districtLayer = makeLayer(districts, districtColor, "DistrictNameA", "DistrictNameE");
            const governorateOpacitySlider = document.getElementById("governorate-opacity");
            const districtOpacitySlider = document.getElementById("district-opacity");
            const governorateOpacityValue = document.getElementById("governorate-opacity-value");
            const districtOpacityValue = document.getElementById("district-opacity-value");
            const governorateSearch = document.getElementById("governorate-search");
            const centerSearch = document.getElementById("center-search");
            const districtSearch = document.getElementById("district-search");
            const projectTypeSearch = document.getElementById("project-type-search");
            const projectStatusSearch = document.getElementById("project-status-search");
            const governorateFeatures = governorateLayer.getLayers();
            const centerFeatures = centerLayer.getLayers();
            const districtFeatures = districtLayer.getLayers();
            let selectedGovernorate = null;
            let selectedCenter = null;
            let selectedDistrict = null;
            let layerControl = null;

            function updateOptionNames(select, featureLayers, arabicField, englishField, fallbackKey) {
                Array.from(select.options).slice(1).forEach(function (option) {
                    const featureLayer = featureLayers[Number(option.value)];
                    if (featureLayer) {
                        option.textContent = localizedFeatureName(
                            featureLayer.feature.properties || {},
                            arabicField,
                            englishField,
                            fallbackKey
                        );
                    }
                });
            }

            function updatePopupNames(featureLayers, arabicField, englishField) {
                featureLayers.forEach(function (featureLayer) {
                    const properties = featureLayer.feature.properties || {};
                    const name = currentLanguage === "ar"
                        ? properties[arabicField] || properties[englishField]
                        : properties[englishField] || properties[arabicField];
                    if (name) {
                        const popup = document.createElement("strong");
                        popup.textContent = String(name);
                        featureLayer.bindPopup(popup);
                    }
                });
            }

            function refreshLayerControl() {
                if (layerControl) {
                    map.removeControl(layerControl);
                }
                layerControl = L.control.layers({
                    [translate("satellite")]: satelliteLayer,
                    [translate("streets")]: streetLayer
                }, {
                    [translate("governorateLayer") + " (" + governorates.features.length + ")"]: governorateLayer,
                    [translate("centerLayer") + " (" + centers.features.length + ")"]: centerLayer,
                    [translate("districtLayer") + " (" + districts.features.length + ")"]: districtLayer
                }, {
                    position: "topleft",
                    collapsed: true
                }).addTo(map);
                const layerContainer = layerControl.getContainer();
                const layersToggle = layerContainer.querySelector(".leaflet-control-layers-toggle");
                layersToggle.title = translate("mapLayers");
                layersToggle.setAttribute("aria-label", translate("mapLayers"));
                const closeLayersButton = document.createElement("button");
                closeLayersButton.className = "leaflet-control-layers-close";
                closeLayersButton.type = "button";
                closeLayersButton.textContent = translate("hideMapLayers");
                closeLayersButton.setAttribute("aria-label", translate("hideMapLayers"));
                L.DomEvent.disableClickPropagation(closeLayersButton);
                closeLayersButton.addEventListener("click", function () {
                    layerControl.collapse();
                });
                layerContainer.appendChild(closeLayersButton);
                zoomControl.setPosition("bottomleft");
            }

            refreshDynamicLanguage = function () {
                updateOptionNames(governorateSearch, governorateFeatures,
                    "GovernorateNameA", "GovernorateNameE", "unknownGovernorate");
                updateOptionNames(centerSearch, centerFeatures,
                    "MarkazNameA", "MarkazNameE", "unknownCenter");
                updateOptionNames(districtSearch, districtFeatures,
                    "DistrictNameA", "DistrictNameE", "unknownDistrict");

                if (centerSearch.options.length) {
                    centerSearch.options[0].textContent = selectedGovernorate
                        ? centerSearch.disabled ? translate("noCenters") : translate("chooseCenter")
                        : translate("chooseGovernorateFirst");
                }
                if (districtSearch.options.length) {
                    districtSearch.options[0].textContent = selectedGovernorate
                        ? districtSearch.disabled ? translate("noDistricts") : translate("chooseDistrict")
                        : translate("chooseGovernorateFirst");
                }

                Array.from(projectStatusSearch.options).slice(1).forEach(function (option) {
                    const status = projectStatuses.find(function (item) {
                        return item.value === option.value;
                    });
                    if (status) {
                        option.textContent = translate(status.key);
                    }
                });
                const projectStatusPlaceholder = projectStatusSearch.options[0];
                if (projectStatusPlaceholder) {
                    projectStatusPlaceholder.textContent = projectTypeSearch.value
                        ? translate("chooseProjectStatus")
                        : translate("chooseProjectTypeFirst");
                }
                const projectSearch = document.getElementById("project-search");
                if (projectSearch.options[0]) {
                    projectSearch.options[0].textContent = projectStatusSearch.value
                        ? translate("noProjects")
                        : translate("projectsAddedLater");
                }

                updatePopupNames(governorateFeatures, "GovernorateNameA", "GovernorateNameE");
                updatePopupNames(centerFeatures, "MarkazNameA", "MarkazNameE");
                updatePopupNames(districtFeatures, "DistrictNameA", "DistrictNameE");
                refreshLayerControl();

                const zoomIn = zoomControl.getContainer().querySelector(".leaflet-control-zoom-in");
                const zoomOut = zoomControl.getContainer().querySelector(".leaflet-control-zoom-out");
                zoomIn.title = translate("zoomIn");
                zoomIn.setAttribute("aria-label", translate("zoomIn"));
                zoomOut.title = translate("zoomOut");
                zoomOut.setAttribute("aria-label", translate("zoomOut"));
            };

            window.addEventListener("resize", function () {
                refreshLayerControl();
            });

            function applyGovernorateStyles() {
                governorateLayer.setStyle({
                    color: governorateColor,
                    weight: 1.5,
                    opacity: 0.9,
                    fillColor: governorateColor,
                    fillOpacity: Number(governorateOpacitySlider.value) / 100
                });
                if (selectedGovernorate) {
                    selectedGovernorate.setStyle({ color: "#ffbf00", weight: 4, opacity: 1 });
                    selectedGovernorate.bringToFront();
                }
            }

            function applyDistrictStyles() {
                districtLayer.setStyle({
                    color: districtColor,
                    weight: 1.5,
                    opacity: 0.9,
                    fillColor: districtColor,
                    fillOpacity: Number(districtOpacitySlider.value) / 100
                });
                if (selectedDistrict) {
                    selectedDistrict.setStyle({
                        color: "#168a45",
                        weight: 4,
                        opacity: 1,
                        fillColor: "#168a45",
                        fillOpacity: Math.max(Number(districtOpacitySlider.value) / 100, 0.3)
                    });
                    selectedDistrict.bringToFront();
                }
            }

            function applyCenterStyles() {
                centerLayer.setStyle({
                    color: "#171717",
                    weight: 1.5,
                    opacity: 0.9,
                    fillColor: "#171717",
                    fillOpacity: 0,
                    dashArray: "6 5"
                });
                if (selectedCenter) {
                    selectedCenter.setStyle({ weight: 3, dashArray: "3 3" });
                    selectedCenter.bringToFront();
                }
            }

            function focusFeature(layer, featureGroup) {
                if (!map.hasLayer(featureGroup)) {
                    map.addLayer(featureGroup);
                }
                const bounds = layer.getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [32, 32], maxZoom: 14 });
                }
            }

            governorateFeatures.forEach(function (featureLayer, index) {
                const properties = featureLayer.feature.properties || {};
                const option = document.createElement("option");
                option.value = String(index);
                option.textContent = localizedFeatureName(
                    properties, "GovernorateNameA", "GovernorateNameE", "unknownGovernorate"
                );
                governorateSearch.appendChild(option);
            });

            governorateSearch.addEventListener("change", function () {
                selectedGovernorate = governorateSearch.value === ""
                    ? null
                    : governorateFeatures[Number(governorateSearch.value)] || null;
                selectedCenter = null;
                selectedDistrict = null;
                centerSearch.replaceChildren();
                districtSearch.replaceChildren();

                const centerPlaceholder = document.createElement("option");
                centerPlaceholder.value = "";
                centerPlaceholder.textContent = selectedGovernorate
                    ? translate("chooseCenter")
                    : translate("chooseGovernorateFirst");
                centerSearch.appendChild(centerPlaceholder);
                centerSearch.disabled = !selectedGovernorate;

                const placeholder = document.createElement("option");
                placeholder.value = "";
                placeholder.textContent = selectedGovernorate
                    ? translate("chooseDistrict")
                    : translate("chooseGovernorateFirst");
                districtSearch.appendChild(placeholder);
                districtSearch.disabled = !selectedGovernorate;

                if (selectedGovernorate) {
                    const governorateName = selectedGovernorate.feature.properties.GovernorateNameA;
                    const matchingCenters = centerFeatures
                        .map(function (featureLayer, index) {
                            return { layer: featureLayer, index: index, properties: featureLayer.feature.properties || {} };
                        })
                        .filter(function (center) {
                            return center.properties.GovernorateNameA === governorateName;
                        })
                        .sort(function (first, second) {
                            const firstName = localizedFeatureName(
                                first.properties, "MarkazNameA", "MarkazNameE", "unknownCenter"
                            );
                            const secondName = localizedFeatureName(
                                second.properties, "MarkazNameA", "MarkazNameE", "unknownCenter"
                            );
                            return firstName.localeCompare(secondName, currentLanguage);
                        });

                    matchingCenters.forEach(function (center) {
                        const option = document.createElement("option");
                        option.value = String(center.index);
                        option.textContent = localizedFeatureName(
                            center.properties, "MarkazNameA", "MarkazNameE", "unknownCenter"
                        );
                        centerSearch.appendChild(option);
                    });

                    if (matchingCenters.length === 0) {
                        centerPlaceholder.textContent = translate("noCenters");
                        centerSearch.disabled = true;
                    }

                    const matchingDistricts = districtFeatures
                        .map(function (featureLayer, index) {
                            return { layer: featureLayer, index: index, properties: featureLayer.feature.properties || {} };
                        })
                        .filter(function (district) {
                            return district.properties.GovernorateNameA === governorateName;
                        })
                        .sort(function (first, second) {
                            const firstName = localizedFeatureName(
                                first.properties, "DistrictNameA", "DistrictNameE", "unknownDistrict"
                            );
                            const secondName = localizedFeatureName(
                                second.properties, "DistrictNameA", "DistrictNameE", "unknownDistrict"
                            );
                            return firstName.localeCompare(secondName, currentLanguage);
                        });

                    matchingDistricts.forEach(function (district) {
                        const option = document.createElement("option");
                        option.value = String(district.index);
                        option.textContent = localizedFeatureName(
                            district.properties, "DistrictNameA", "DistrictNameE", "unknownDistrict"
                        );
                        districtSearch.appendChild(option);
                    });

                    if (matchingDistricts.length === 0) {
                        placeholder.textContent = translate("noDistricts");
                        districtSearch.disabled = true;
                    }
                }

                applyGovernorateStyles();
                applyCenterStyles();
                applyDistrictStyles();
                if (selectedGovernorate) {
                    focusFeature(selectedGovernorate, governorateLayer);
                }
            });

            centerSearch.addEventListener("change", function () {
                selectedCenter = centerSearch.value === ""
                    ? null
                    : centerFeatures[Number(centerSearch.value)] || null;
                applyCenterStyles();
                if (selectedCenter) {
                    focusFeature(selectedCenter, centerLayer);
                }
            });

            districtSearch.addEventListener("change", function () {
                selectedDistrict = districtSearch.value === ""
                    ? null
                    : districtFeatures[Number(districtSearch.value)] || null;
                applyDistrictStyles();
                if (selectedDistrict) {
                    focusFeature(selectedDistrict, districtLayer);
                }
            });

            projectTypeSearch.addEventListener("change", function () {
                projectStatusSearch.replaceChildren();
                const placeholder = document.createElement("option");
                placeholder.value = "";
                placeholder.textContent = projectTypeSearch.value
                    ? translate("chooseProjectStatus")
                    : translate("chooseProjectTypeFirst");
                projectStatusSearch.appendChild(placeholder);
                projectStatusSearch.disabled = !projectTypeSearch.value;

                if (projectTypeSearch.value) {
                    projectStatuses.forEach(function (status) {
                        const option = document.createElement("option");
                        option.value = status.value;
                        option.textContent = translate(status.key);
                        projectStatusSearch.appendChild(option);
                    });
                }

                const projectSearch = document.getElementById("project-search");
                projectSearch.replaceChildren();
                const projectPlaceholder = document.createElement("option");
                projectPlaceholder.value = "";
                projectPlaceholder.textContent = translate("projectsAddedLater");
                projectSearch.appendChild(projectPlaceholder);
                projectSearch.disabled = true;
            });

            projectStatusSearch.addEventListener("change", function () {
                const projectSearch = document.getElementById("project-search");
                projectSearch.replaceChildren();
                const placeholder = document.createElement("option");
                placeholder.value = "";
                placeholder.textContent = projectStatusSearch.value
                    ? translate("noProjects")
                    : translate("projectsAddedLater");
                projectSearch.appendChild(placeholder);
                projectSearch.disabled = true;
            });

            governorateOpacitySlider.addEventListener("input", function () {
                const percentage = Number(governorateOpacitySlider.value);
                applyGovernorateStyles();
                governorateOpacityValue.value = formatOpacity(percentage);
                governorateOpacityValue.textContent = formatOpacity(percentage);
            });
            districtOpacitySlider.addEventListener("input", function () {
                const percentage = Number(districtOpacitySlider.value);
                applyDistrictStyles();
                districtOpacityValue.value = formatOpacity(percentage);
                districtOpacityValue.textContent = formatOpacity(percentage);
            });
            governorateLayer.addTo(map);
            districtLayer.addTo(map);
            centerLayer.addTo(map);
            refreshDynamicLanguage();

            const bounds = L.featureGroup([governorateLayer, centerLayer, districtLayer]).getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: [24, 24] });
            }

            message.hidden = true;
        }

        loadMapData().catch(function (error) {
            mapMessageDetailKey = "mapDataError";
            mapMessageDetailValues = {};
            mapMessageSuffix = "";
            if (error.message.indexOf("file:") === 0) {
                mapMessageDetailKey = "fileLoadError";
                mapMessageDetailValues.file = error.message.slice("file:".length);
                mapMessageSuffix = window.location.protocol === "file:"
                    ? "localFileHint"
                    : "networkFileHint";
            } else if (error.message === "invalidGeoJson") {
                mapMessageDetailKey = "invalidGeoJson";
            }
            mapMessageKey = "loadFailure";
            const messageDetail = translate(mapMessageDetailKey, mapMessageDetailValues) +
                (mapMessageSuffix ? translate(mapMessageSuffix) : "");
            message.textContent = translate(mapMessageKey, { details: messageDetail });
            message.hidden = false;
            message.classList.add("error");
            console.error("تعذر تحميل بيانات الخريطة:", error);
        });
    </script>
</body>
</html>
